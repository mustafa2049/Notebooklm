# Netlify'a depoyu bağlayıp sürekli yayına almak için.
# Elle sürükle-bırak dağıtımında bu dosyaya gerek yok; yönlendirme kuralı
# `public/_redirects` içinde ve derleme çıktısına kopyalanıyor.

[build]
  # expo export + service worker (bkz. scripts/generate-sw.mjs)
  command = "npm run build:web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
