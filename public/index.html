<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>

    <!--
      PWA künyesi. Uygulama telefona kurulunca (Chrome → "Uygulamayı yükle")
      Android'in Paylaş menüsünde görünür; manifest içindeki `share_target`
      paylaşılan metni /import adresine sorgu parametresi olarak getirir.
      Bu dosya Expo'nun varsayılan HTML kabuğunun kopyası: `output: 'single'`
      modunda kabuk `public/index.html`'den okunuyor (app/+html.tsx yalnızca
      statik render modunda kullanılıyor).
    -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      Bu uygulamayı çalıştırmak için JavaScript gerekiyor.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
